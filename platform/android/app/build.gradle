plugins { id 'com.android.application' }

android {
    namespace = 'com.toycars.game'
    compileSdk = 36
    ndkVersion = '28.2.13676358'
    defaultConfig {
        applicationId = 'com.toycars.game'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DSDL3_SOURCE_DIR=' + file('../../../third_party/SDL').absolutePath,
                    '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
                targets 'main', 'SDL3-shared'
            }
        }
    }
    sourceSets {
        main {
            java.srcDirs += '../../../third_party/SDL/android-project/app/src/main/java'
            assets.srcDirs = ['../../../assets']
        }
    }
    externalNativeBuild {
        cmake { path '../../../CMakeLists.txt'; version '3.22.1' }
    }
    buildTypes {
        release { minifyEnabled = false }
    }
}
